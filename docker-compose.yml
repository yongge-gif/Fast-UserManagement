version: "3.9"

services:

  # Mysql服务
  mysql:

    image: mysql:8.0

    container_name: fastapi_mysql

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: fastapi_db

    ports:
      - "3308:3306"

    networks:
      - fastapi_network


  # redis服务
  redis:

    image: redis

    container_name: fastapi_redis

    ports:
      - "6379:6379"

    networks:
      - fastapi_network


  # Fastapi服务
  fastapi:

    build: .

    container_name: fastapi_app

    ports:
      - "8000:8000"

    depends_on:
      - mysql
      - redis

    # 环境变量
    environment:
      DATABASE_URL: mysql+pymysql://root:123456@mysql:3306/fastapi_db
      REDIS_HOST: redis

    networks:
      - fastapi_network



  # 添加 Celery Worker
  celery:

    build: .

    container_name: fastapi_celery

    command: celery -A celery_app.celery worker --pool=solo -l info

    depends_on:
      - redis

    networks:
      - fastapi_network


# 创建网络
networks:

  fastapi_network: