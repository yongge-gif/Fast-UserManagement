# 工作流
name: FastAPI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest


    services:

      # 测试环境自动启动mysql
      mysql:
        image: mysql:8

       # 直接在 GitHub Actions 启动 Redis 服务。
      redis:

        image: redis:7

        ports:
          - 6379:6379

    steps:

      # 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4  # 调用 GitHub 官方 checkout 插件（第4版）, 作用是把你的仓库代码下载到 GitHub Actions 运行环境

      # 安装python
      - name: Setup Python
        uses: actions/setup-python@v5  # 在 GitHub Actions 的 Ubuntu 虚拟机中安装 Python

        with:
          python-version: "3.11"

      # 安装依赖
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      

      # 创建测试环境变量
      - name: Create .env
        run: |
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          echo "SECRET_KEY=test_secret" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env

      # 执行测试
      - name: Run Tests
        run: |
          pytest